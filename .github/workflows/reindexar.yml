# O indice e derivado. Quando um MODULO.md espelhado entra, o indice se
# reconstroi sozinho — ninguem edita modulos.json a mao num PR de modulo.
name: reindexar catalogo

on:
  push:
    branches: [main]
    paths: ["docs/modulos/mod/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reindexar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: reconstruir indice e tabela
        run: python3 scripts/reindexar.py --escrever --catalogo docs/modulos

      - name: commitar se mudou
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "indice ja estava em dia"
            exit 0
          fi
          git config user.name "modulex"
          git config user.email "modulex@users.noreply.github.com"
          git add docs/modulos
          git commit -m "catalogo: reindexar"
          git push
